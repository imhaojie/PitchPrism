name: Publish demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pitchprism-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch and verify the published media
        run: python product/football/scripts/fetch_media.py
      - name: Export the local editorial demo
        run: python product/football/scripts/export_demo.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: product/football/build/site
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy demo
        id: deployment
        uses: actions/deploy-pages@v4
